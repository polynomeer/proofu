spring:
  application:
    name: proofu-worker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/proofu}
    username: ${DATABASE_USERNAME:proofu}
    password: ${DATABASE_PASSWORD:proofu}
  threads:
    virtual:
      enabled: true
  main:
    web-application-type: none
    # Virtual-thread schedulers are daemon threads; without this the JVM exits right after startup.
    keep-alive: true

proofu:
  worker:
    poll-interval: ${WORKER_POLL_INTERVAL:2s}
    batch-size: ${WORKER_BATCH_SIZE:5}
    retention-interval: ${WORKER_RETENTION_INTERVAL:1h}
    retention-initial-delay: ${WORKER_RETENTION_INITIAL_DELAY:1m}
  ai:
    provider: ${AI_PROVIDER:fake}
    api-key: ${ANTHROPIC_API_KEY:}
    default-model: ${AI_MODEL_DEFAULT:claude-opus-5}
    workspace-monthly-budget-usd: ${AI_WORKSPACE_MONTHLY_BUDGET_USD:5}
    workspace-hourly-job-limit: ${AI_WORKSPACE_HOURLY_JOB_LIMIT:30}
    deployment-daily-budget-usd: ${AI_DAILY_BUDGET_USD:50}
    max-input-tokens: ${AI_MAX_INPUT_TOKENS:50000}

logging:
  level:
    root: info
    com.proofu: debug
