# Production overrides: nothing here has a permissive default. Missing env → startup failure.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

proofu:
  auth:
    # OIDC only (ADR-0010). Issuer and JWKS are mandatory; the API starts without them refusing every request.
    mode: oidc
    issuer: ${OIDC_ISSUER}
    jwks-uri: ${OIDC_JWKS_URI}
    # The web BFF client: ID tokens for step-up must be issued to it (ADR-0010 결정 3).
    client-id: ${OIDC_CLIENT_ID}
  ai:
    # The fake provider is refused under this profile (AiGatewayConfig); a key is mandatory.
    provider: ${AI_PROVIDER:anthropic}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    com.proofu: info
    org.hibernate.SQL: off
