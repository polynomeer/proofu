spring:
  application:
    name: proofu-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/proofu}
    username: ${DATABASE_USERNAME:proofu}
    password: ${DATABASE_PASSWORD:proofu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

proofu:
  auth:
    mode: ${AUTH_MODE:header}
    issuer: ${OIDC_ISSUER:}
    jwks-uri: ${OIDC_JWKS_URI:}
    audience: ${OIDC_AUDIENCE:proofu-api}
    reauth-max-age: ${AUTH_REAUTH_MAX_AGE:10m}
  ai:
    provider: ${AI_PROVIDER:fake}
    api-key: ${ANTHROPIC_API_KEY:}
    default-model: ${AI_MODEL_DEFAULT:claude-opus-5}
    workspace-monthly-budget-usd: ${AI_WORKSPACE_MONTHLY_BUDGET_USD:5}
    workspace-hourly-job-limit: ${AI_WORKSPACE_HOURLY_JOB_LIMIT:30}
    deployment-daily-budget-usd: ${AI_DAILY_BUDGET_USD:50}
    max-input-tokens: ${AI_MAX_INPUT_TOKENS:50000}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

# Deployments set MANAGEMENT_SERVER_PORT to move health and the metrics scrape off the public
# port (Spring binds that env var to management.server.port); unset means the same port.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs
  paths-to-match: /api/**
  default-produces-media-type: application/json

logging:
  level:
    root: info
    com.proofu: debug
