spring:
  application:
    name: proofu-api
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/proofu}
    username: ${DATABASE_USERNAME:proofu}
    password: ${DATABASE_PASSWORD:proofu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs
  paths-to-match: /api/**
  default-produces-media-type: application/json

logging:
  level:
    root: info
    com.proofu: debug
