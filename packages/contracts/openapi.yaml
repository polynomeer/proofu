        name:
          type: string
          maxLength: 200
        role:
          type: string
          maxLength: 200
        summary:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        teamSize:
          type: integer
          minimum: 1
        links:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProjectLink"
        visibility:
          $ref: "#/components/schemas/Visibility"

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [id, links, visibility, revision, createdAt, updatedAt]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            links:
              type: array
              items:
                $ref: "#/components/schemas/ProjectLink"
            visibility:
              $ref: "#/components/schemas/Visibility"
            revision:
              $ref: "#/components/schemas/Revision"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    AchievementInput:
      type: object
      required: [action, outcome, confidence]
      properties:
        action:
          type: string
          description: What was done
        outcome:
          type: string
          description: What changed as a result
        metricValue:
          type: [number, "null"]
        metricUnit:
          type: [string, "null"]
          maxLength: 40
        baseline:
          type: [string, "null"]
          maxLength: 200
        timeframe:
          type: [string, "null"]
          maxLength: 120
        confidence:
          $ref: "#/components/schemas/Confidence"

    Achievement:
      allOf:
        - $ref: "#/components/schemas/AchievementInput"
        - type: object
          required: [id, projectId, revision, createdAt, updatedAt]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            projectId:
              $ref: "#/components/schemas/Uuid"
            revision:
              $ref: "#/components/schemas/Revision"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    Sensitivity:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
    EvidenceType:
      type: string
      enum: [FILE, URL, REPOSITORY, COMMIT, METRIC, CERTIFICATE, NOTE, REFERENCE_LETTER]
    EvidenceSource:
      type: string
      enum: [USER_INPUT, EXTERNAL_IMPORT, SYSTEM_EXTRACTED]
    VerificationStatus:
      type: string
      enum: [UNVERIFIED, USER_VERIFIED, EXTERNALLY_VERIFIED, EXPIRED]
    ClaimType:
      type: string
      enum: [FACT, INFERENCE, OPINION]
    ClaimStatus:
      type: string
      enum: [UNSUPPORTED, SUPPORTED, CONTESTED]
    ClaimSourceType:
      type: string
      enum: [CAREER_ENTRY, PROJECT, ACHIEVEMENT]

    EvidenceInput:
      type: object
      required: [type, title]
      description: NOTE needs `body`; every other type needs an absolute http(s) `uri`. FILE is created through upload sessions.
      properties:
        type:
          $ref: "#/components/schemas/EvidenceType"
        title:
          type: string
          maxLength: 200
        uri:
          type: [string, "null"]
          format: uri
        body:
          type: [string, "null"]
        capturedAt:
          type: string
          format: date-time
          description: When the evidence was captured; defaults to now
        verification:
          $ref: "#/components/schemas/VerificationStatus"
        sensitivity:
          $ref: "#/components/schemas/Sensitivity"

    Evidence:
      allOf:
        - $ref: "#/components/schemas/EvidenceInput"
        - type: object
          required:
            [
              id,
              source,
              capturedAt,
              verification,
              sensitivity,
              linkedClaimCount,
              revision,
              createdAt,
              updatedAt,
            ]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            source:
              $ref: "#/components/schemas/EvidenceSource"
            capturedAt:
              type: string
              format: date-time
            verification:
              $ref: "#/components/schemas/VerificationStatus"
            sensitivity:
              $ref: "#/components/schemas/Sensitivity"
            linkedClaimCount:
              type: integer
            revision:
              $ref: "#/components/schemas/Revision"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ClaimSourceInput:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/ClaimSourceType"
        id:
          $ref: "#/components/schemas/Uuid"

    ClaimSource:
      allOf:
        - $ref: "#/components/schemas/ClaimSourceInput"
        - type: object
          required: [revision]
          properties:
            revision:
              $ref: "#/components/schemas/Revision"
            title:
              type: [string, "null"]
              description: Display name of the record at read time (entry title, project name or achievement action)
            projectId:
              type: [string, "null"]
              format: uuid
              description: For ACHIEVEMENT sources, the project the achievement belongs to

    ClaimInput:
      type: object
      required: [text, type]
      properties:
        text:
          type: string
        type:
          $ref: "#/components/schemas/ClaimType"
        sensitivity:
          $ref: "#/components/schemas/Sensitivity"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ClaimSourceInput"

    ClaimEvidenceLink:
      type: object
      required:
        [evidenceId, evidenceTitle, evidenceType, evidenceVerification, relation, confidence]
      properties:
        evidenceId:
          $ref: "#/components/schemas/Uuid"
        evidenceTitle:
          type: string
        evidenceType:
          $ref: "#/components/schemas/EvidenceType"
        evidenceVerification:
          $ref: "#/components/schemas/VerificationStatus"
        relation:
          $ref: "#/components/schemas/EvidenceRelation"
        confidence:
          $ref: "#/components/schemas/Confidence"
        scope:
          type: [string, "null"]

    Claim:
      type: object
      required:
        [id, text, type, sensitivity, status, sources, links, revision, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        text:
          type: string
        type:
          $ref: "#/components/schemas/ClaimType"
        sensitivity:
          $ref: "#/components/schemas/Sensitivity"
        status:
          $ref: "#/components/schemas/ClaimStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ClaimSource"
        links:
          type: array
          items:
            $ref: "#/components/schemas/ClaimEvidenceLink"
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClaimList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Claim"

    SnapshotSource:
      type: string
      enum: [MANUAL_TEXT, URL_FETCH, CAREER_OPS]

    JobPostingSnapshotSummary:
      type: object
      required: [id, source, contentHash, capturedAt, textPreview]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        source:
          $ref: "#/components/schemas/SnapshotSource"
        sourceUrl:
          type: [string, "null"]
        contentHash:
          type: string
        capturedAt:
          type: string
          format: date-time
        textPreview:
          type: string
          description: First ~200 characters of the captured text

    JobPostingSnapshot:
      allOf:
        - $ref: "#/components/schemas/JobPostingSnapshotSummary"
        - type: object
          required: [postingId, rawText]
          properties:
            postingId:
              $ref: "#/components/schemas/Uuid"
            rawText:
              type: string

    JobPosting:
      type: object
      required: [id, company, roleTitle, snapshotCount, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        company:
          type: string
        roleTitle:
          type: string
        canonicalUrl:
          type: [string, "null"]
        externalPostingId:
          type: [string, "null"]
        publishedAt:
          type: [string, "null"]
          format: date-time
        snapshotCount:
          type: integer
        latestSnapshot:
          oneOf:
            - $ref: "#/components/schemas/JobPostingSnapshotSummary"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobPostingDetail:
      allOf:
        - $ref: "#/components/schemas/JobPosting"
        - type: object
          required: [snapshots]
          properties:
            snapshots:
              type: array
              items:
                $ref: "#/components/schemas/JobPostingSnapshotSummary"

    ImportResult:
      type: object
      required: [postingId, snapshotId, contentHash, capturedAt, snapshotCreated]
      properties:
        postingId:
          $ref: "#/components/schemas/Uuid"
        snapshotId:
          $ref: "#/components/schemas/Uuid"
        contentHash:
          type: string
        capturedAt:
          type: string
          format: date-time
        snapshotCreated:
          type: boolean

    RequirementOrigin:
      type: string
      enum: [USER, AI]

    SourceSpan:
      type: object
      required: [start, end]
      description: Character range [start, end) in the snapshot's rawText
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1

    Requirement:
      type: object
      required:
        [id, snapshotId, category, text, confidence, origin, status, version, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        snapshotId:
          $ref: "#/components/schemas/Uuid"
        category:
          $ref: "#/components/schemas/RequirementCategory"
        text:
          type: string
        sourceSpan:
          oneOf:
            - $ref: "#/components/schemas/SourceSpan"
            - type: "null"
        excerpt:
          type: [string, "null"]
          description: The snapshot text the span points at, for display
        confidence:
          $ref: "#/components/schemas/Confidence"
        origin:
          $ref: "#/components/schemas/RequirementOrigin"
        status:
          $ref: "#/components/schemas/RequirementStatus"
        approvedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Application:
      type: object
      required:
        [
          id,
          snapshotId,
          postingId,
          company,
          roleTitle,
          status,
          allowedTransitions,
          statusChangedAt,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        snapshotId:
          $ref: "#/components/schemas/Uuid"
        postingId:
          $ref: "#/components/schemas/Uuid"
        company:
          type: string
        roleTitle:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        allowedTransitions:
          type: array
          description: Statuses the domain allows next, minus HANDED_OFF_TO_ITERVIEW which needs a handoff
          items:
            $ref: "#/components/schemas/ApplicationStatus"
        statusChangedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicationStatusEvent:
      type: object
      required: [to, occurredAt]
      properties:
        from:
          oneOf:
            - $ref: "#/components/schemas/ApplicationStatus"
            - type: "null"
        to:
          $ref: "#/components/schemas/ApplicationStatus"
        note:
          type: [string, "null"]
        occurredAt:
          type: string
          format: date-time

    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          required: [events, snapshot]
          properties:
            events:
              type: array
              description: Oldest first
              items:
                $ref: "#/components/schemas/ApplicationStatusEvent"
            snapshot:
              $ref: "#/components/schemas/JobPostingSnapshotSummary"

    SubmissionSnapshot:
      type: object
      required:
        [
          id,
          applicationId,
          documentId,
          documentTitle,
          documentType,
          documentVersionId,
          versionCreatedBy,
          postingSnapshotId,
          hash,
          submittedAt,
          createdAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        applicationId:
          $ref: "#/components/schemas/Uuid"
        documentId:
          $ref: "#/components/schemas/Uuid"
        documentTitle:
          type: string
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentVersionId:
          $ref: "#/components/schemas/Uuid"
        versionLabel:
          type: string
        versionCreatedBy:
          type: string
          enum: [USER, AI]
        postingSnapshotId:
          $ref: "#/components/schemas/Uuid"
        hash:
          type: string
        submittedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    SubmissionDetail:
      allOf:
        - $ref: "#/components/schemas/SubmissionSnapshot"
        - type: object
          required: [version, sections, company, roleTitle]
          properties:
            version:
              $ref: "#/components/schemas/DocumentVersion"
            sections:
              description: Sections of the template the frozen version was written with
              type: array
              items:
                $ref: "#/components/schemas/TemplateSection"
            company:
              type: string
            roleTitle:
              type: string

    ReviewContext:
      type: object
      required: [applicationId, status, postingSnapshot, requirements, submissionCount]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        postingSnapshot:
          type: object
          required: [id, postingId, capturedAt, approvedRequirementCount]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            postingId:
              $ref: "#/components/schemas/Uuid"
            capturedAt:
              type: string
              format: date-time
            approvedRequirementCount:
              type: integer
        submissionCount:
          type: integer
        submission:
          description: The latest submission snapshot, when one exists
          $ref: "#/components/schemas/SubmissionSnapshot"
        document:
          description: Facts about the submitted version (domain SubmissionFacts)
          type: object
          required:
            [
              totalBlocks,
              blocksWithClaims,
              supportedBlocks,
              approvedWithoutEvidence,
              evidenceLinkRate,
              requirementCoverage,
            ]
          properties:
            totalBlocks:
              type: integer
            blocksWithClaims:
              type: integer
            supportedBlocks:
              type: integer
            approvedWithoutEvidence:
              type: integer
            evidenceLinkRate:
              description: 0–100
              type: integer
            requirementCoverage:
              description: 0–100
              type: integer
        matchRunAt:
          type: string
          format: date-time
        requirements:
          description: Approved requirements, REQUIRED first
          type: array
          items:
            type: object
            required: [id, category, text, addressedBySubmission]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              category:
                $ref: "#/components/schemas/RequirementCategory"
              text:
                type: string
              assessment:
                $ref: "#/components/schemas/RequirementAssessment"
              acceptedCandidates:
                type: integer
              addressedBySubmission:
                description: false also when there is no submission
                type: boolean

    MatchDecision:
      type: string
      enum: [ACCEPTED, REJECTED]

    RequirementAssessment:
      type: string
      enum: [MET, PARTIALLY_MET, UNVERIFIED, UNMET]

    ScoreBand:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    MatchFeatures:
      type: object
      required:
        [requirementCoverage, evidenceStrength, recency, complexity, impact, semanticSimilarity]
      properties:
        requirementCoverage:
          type: number
        evidenceStrength:
          type: number
        recency:
          type: number
        complexity:
          type: number
        impact:
          type: number
        semanticSimilarity:
          type: number

    RequirementMatch:
      type: object
      required: [id, claimId, claimText, claimStatus, sources, evidence, score, band, features]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        claimId:
          $ref: "#/components/schemas/Uuid"
        claimText:
          type: string
        claimStatus:
          $ref: "#/components/schemas/ClaimStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ClaimSource"
        evidence:
          type: array
          items:
            type: object
            required: [id, title, verification, relation]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              title:
                type: string
              verification:
                $ref: "#/components/schemas/VerificationStatus"
              relation:
                $ref: "#/components/schemas/EvidenceRelation"
        score:
          type: integer
          description: 0–100 ordering aid, never a probability; max 90 until semantic search exists
        band:
          $ref: "#/components/schemas/ScoreBand"
        features:
          $ref: "#/components/schemas/MatchFeatures"
        reason:
          type: [string, "null"]
          description: Model-written explanation; null when the model did not cover this pair
        matchedRequirementPhrase:
          type: [string, "null"]
        matchedEvidencePhrase:
          type: [string, "null"]
        userDecision:
          oneOf:
            - $ref: "#/components/schemas/MatchDecision"
            - type: "null"

    RequirementMatchGroup:
      type: object
      required: [requirement, candidates]
      properties:
        requirement:
          $ref: "#/components/schemas/Requirement"
        assessment:
          oneOf:
            - $ref: "#/components/schemas/RequirementAssessment"
            - type: "null"
          description: Only for REQUIRED items
        candidates:
          type: array
          description: Best first
          items:
            $ref: "#/components/schemas/RequirementMatch"

    MatchReport:
      type: object
      required: [applicationId, groups, gaps, hasRun]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        hasRun:
          type: boolean
        lastRunAt:
          type: [string, "null"]
          format: date-time
        groups:
          type: array
          description: REQUIRED first, then by confidence (design §8.2)
          items:
            $ref: "#/components/schemas/RequirementMatchGroup"
        gaps:
          type: array
          description: REQUIRED requirements assessed UNMET or UNVERIFIED
          items:
            $ref: "#/components/schemas/Uuid"

    ReviewInput:
      type: object
      required: [observedFact, hypothesis]
      properties:
        observedFact:
          type: string
        hypothesis:
          type: string
        rationale:
          type: string
        confidence:
          $ref: "#/components/schemas/ReviewConfidence"
        improvementAction:
          type: string
        verificationPlan:
          type: string

    Review:
      allOf:
        - $ref: "#/components/schemas/ReviewInput"
        - type: object
          required: [id, applicationId, confidence, warnings, version, createdAt, updatedAt]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            applicationId:
              $ref: "#/components/schemas/Uuid"
            confidence:
              $ref: "#/components/schemas/ReviewConfidence"
            warnings:
              type: array
              description: Definitive-cause phrases found in the hypothesis or rationale
              items:
                type: string
            version:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DocumentType:
      type: string
      enum: [RESUME, COVER_LETTER, PORTFOLIO]

    Document:
      type: object
      required: [id, applicationId, type, title, language, version, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        applicationId:
          $ref: "#/components/schemas/Uuid"
        type:
          $ref: "#/components/schemas/DocumentType"
        title:
          type: string
        language:
          type: string
        latestVersionId:
          $ref: "#/components/schemas/Uuid"
        latestVersionCreatedBy:
          type: string
          enum: [USER, AI]
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          required: [sections, pendingApprovalCount]
          properties:
            latestVersion:
              $ref: "#/components/schemas/DocumentVersion"
            sections:
              description: Sections of the latest version's template (or the current template when there is no version)
              type: array
              items:
                $ref: "#/components/schemas/TemplateSection"
            pendingApprovalCount:
              description: Blocks of the latest version that block an export until approved
              type: integer

    TemplateSection:
      type: object
      required: [id, title, guidance]
      properties:
        id:
          type: string
        title:
          type: string
        guidance:
          type: string

    DocumentBlock:
      type: object
      required: [blockId, text, certainty]
      properties:
        blockId:
          description: "`<section id>-<n>`; stable across versions"
          type: string
        text:
          type: string
        claimRefs:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        evidenceRefs:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        requirementRefs:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        certainty:
          $ref: "#/components/schemas/Certainty"
        warnings:
          type: array
          items:
            type: string
        approvedByUser:
          type: boolean
          default: false

    DocumentVersion:
      type: object
      required: [id, documentId, blocks, templateVersion, createdBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        documentId:
          $ref: "#/components/schemas/Uuid"
        parentId:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentBlock"
        templateVersion:
          type: string
        promptVersion:
          type: string
        modelRef:
          type: string
        createdBy:
          type: string
          enum: [USER, AI]
        createdAt:
          type: string
          format: date-time
        provenance:
          description: Source revisions each block was derived from; never changes after the version is written
          type: array
          items:
            $ref: "#/components/schemas/ProvenanceLink"

    ProvenanceLink:
      type: object
      required: [blockId, sourceType, sourceId, sourceRevision, relation]
      properties:
        blockId:
          type: string
        sourceType:
          type: string
          enum: [CAREER_ENTRY, PROJECT, ACHIEVEMENT, CLAIM, EVIDENCE, REQUIREMENT]
        sourceId:
          $ref: "#/components/schemas/Uuid"
        sourceRevision:
          type: integer
          format: int64
        relation:
          type: string
          enum: [DERIVED_FROM, CITES, ADDRESSES]

    Job:
      type: object
      required: [id, type, status, attempts, createdAt]
      description: |
        Poll until status is SUCCEEDED, FAILED or CANCELLED. errorCode is one of the API
        ErrorCode values (e.g. AI_BUDGET_EXCEEDED, AI_REFUSED, AI_OUTPUT_INVALID,
        AI_PROVIDER_UNAVAILABLE) or a job-specific code.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        attempts:
          type: integer
        errorCode:
