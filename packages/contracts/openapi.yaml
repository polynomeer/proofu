openapi: 3.1.0
info:
  title: ProofU API
  version: 0.1.0
  description: |
    Career source of truth: evidence-linked career data, job posting analysis, explainable
    matching, traceable application documents, immutable submission snapshots and reviews.

    Conventions (docs/api/conventions.md):
    * Base path `/api/v1`, JSON, UTF-8.
    * `201` on create, `202` + `jobId` for asynchronous work, polled via `GET /jobs/{id}`.
    * Errors are RFC 9457 Problem Details with a stable `code` property.
    * Cursor pagination (`cursor`, `limit` ≤ 100). Mutations carry `version`/`revision` for optimistic locking.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: dashboard
    description: Read models that summarise a workspace
  - name: career
    description: Career source of truth (entries, projects, achievements, skills)
  - name: evidence
    description: Evidence files and links, and their relation to claims
  - name: jobs
    description: Job postings, immutable snapshots and extracted requirements
  - name: applications
    description: Application lifecycle, submissions, reviews and interview handoff
  - name: documents
    description: Resume and cover letter versions, provenance and exports
  - name: async
    description: Long-running work accepted with 202 and polled via /jobs/{id}

paths:
  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Workspace summary for the dashboard (D01)
      description: |
        KPI definitions follow docs/design/screens.md: career entries exclude deleted rows,
        verified evidence counts USER_VERIFIED and EXTERNALLY_VERIFIED, active applications
        exclude terminal states, and evidence coverage is the share of live claims with at
        least one linked evidence item. Ratios are integers 0–100.
      parameters:
        - name: timelineType
          in: query
          schema:
            $ref: "#/components/schemas/CareerEntryType"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        default:
          $ref: "#/components/responses/Problem"

  /ai/usage:
    get:
      tags: [dashboard]
      operationId: getAiUsage
      summary: The workspace's AI budget position (ADR-0008 §6)
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    provider,
                    model,
                    monthSpentUsd,
                    monthBudgetUsd,
                    monthUsedPercent,
                    jobsLastHour,
                    hourlyLimit,
                  ]
                properties:
                  provider:
                    type: string
                  model:
                    type: string
                  monthSpentUsd:
                    type: number
                  monthBudgetUsd:
                    type: number
                  monthUsedPercent:
                    type: integer
                  jobsLastHour:
                    type: integer
                  hourlyLimit:
                    type: integer
        default:
          $ref: "#/components/responses/Problem"

  /career-entries:
    get:
      tags: [career]
      operationId: listCareerEntries
      summary: List career entries in the caller's workspace
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/CareerEntryType"
        - name: q
          in: query
          description: Full-text search over title and description
          schema:
            type: string
      responses:
        "200":
          description: Page of career entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CareerEntry"
                  nextCursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [career]
      operationId: createCareerEntry
      summary: Create a career entry
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEntry"
        default:
          $ref: "#/components/responses/Problem"

  /career-entries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [career]
      operationId: getCareerEntry
      summary: Get a career entry
      responses:
        "200":
          description: Career entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEntry"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [career]
      operationId: updateCareerEntry
      summary: Update a career entry (optimistic locking via revision)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CareerEntryInput"
                - type: object
                  required: [revision]
                  properties:
                    revision:
                      $ref: "#/components/schemas/Revision"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEntry"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [career]
      operationId: deleteCareerEntry
      summary: Soft-delete a career entry (30-day trash)
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /projects:
    get:
      tags: [career]
      operationId: listProjects
      summary: List projects, optionally those attached to one career entry
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: careerEntryId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Page of projects, most recent first (projects without a start date come first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  nextCursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [career]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [career]
      operationId: getProject
      summary: Get a project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [career]
      operationId: updateProject
      summary: Update a project (optimistic locking via revision)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ProjectInput"
                - type: object
                  required: [revision]
                  properties:
                    revision:
                      $ref: "#/components/schemas/Revision"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [career]
      operationId: deleteProject
      summary: Soft-delete a project and its achievements (30-day trash)
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /projects/{id}/achievements:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [career]
      operationId: listAchievements
      summary: List a project's achievements in creation order
      responses:
        "200":
          description: Achievements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Achievement"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [career]
      operationId: createAchievement
      summary: Record a measurable outcome on a project
      description: A metric value requires a unit. The number is stored as given; it is not evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"
        default:
          $ref: "#/components/responses/Problem"

  /achievements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [career]
      operationId: getAchievement
      summary: Get an achievement
      responses:
        "200":
          description: Achievement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [career]
      operationId: updateAchievement
      summary: Update an achievement (optimistic locking via revision)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AchievementInput"
                - type: object
                  required: [revision]
                  properties:
                    revision:
                      $ref: "#/components/schemas/Revision"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [career]
      operationId: deleteAchievement
      summary: Soft-delete an achievement
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /evidence:
    get:
      tags: [evidence]
      operationId: listEvidence
      summary: List evidence in the caller's workspace, newest capture first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceType"
        - name: verification
          in: query
          schema:
            $ref: "#/components/schemas/VerificationStatus"
        - name: q
          in: query
          description: Full-text search over title and body
          schema:
            type: string
      responses:
        "200":
          description: Page of evidence
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Evidence"
                  nextCursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [evidence]
      operationId: createEvidence
      summary: Register evidence (link-like types and notes; files arrive via upload sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        default:
          $ref: "#/components/responses/Problem"

  /evidence/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [evidence]
      operationId: getEvidence
      summary: Get evidence
      responses:
        "200":
          description: Evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [evidence]
      operationId: updateEvidence
      summary: Update evidence, including the user-settable verification state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EvidenceInput"
                - type: object
                  required: [revision]
                  properties:
                    revision:
                      $ref: "#/components/schemas/Revision"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [evidence]
      operationId: deleteEvidence
      summary: Soft-delete evidence; its claim links are removed and affected claims become unsupported
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /evidence/{id}/claims:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [evidence]
      operationId: listClaimsForEvidence
      summary: Claims this evidence is linked to
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimList"
        default:
          $ref: "#/components/responses/Problem"

  /claims:
    get:
      tags: [evidence]
      operationId: listClaims
      summary: List claims, filtered by the record they are about
      description: Pass `sourceType`+`sourceId` for one record, or `projectId` for a project and all of its achievements.
      parameters:
        - name: sourceType
          in: query
          schema:
            $ref: "#/components/schemas/ClaimSourceType"
        - name: sourceId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: projectId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Claims, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [evidence]
      operationId: createClaim
      summary: Create a claim about one or more career records
      description: Each source's current revision is pinned so the claim can be re-read against what it was made about.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "201":
          description: Created (status UNSUPPORTED until evidence is linked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Problem"

  /claims/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [evidence]
      operationId: getClaim
      summary: Get a claim with its evidence links and derived status
      responses:
        "200":
          description: Claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [evidence]
      operationId: updateClaim
      summary: Update claim text, type or sensitivity (sources are fixed at creation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, type, revision]
              properties:
                text:
                  type: string
                type:
                  $ref: "#/components/schemas/ClaimType"
                sensitivity:
                  $ref: "#/components/schemas/Sensitivity"
                revision:
                  $ref: "#/components/schemas/Revision"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [evidence]
      operationId: deleteClaim
      summary: Soft-delete a claim
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /claims/{id}/evidence:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [evidence]
      operationId: linkEvidenceToClaim
      summary: Link evidence to a claim
      description: Evidence must belong to the same workspace. Partial support requires `scope`. Returns the updated claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidenceId, relation, confidence]
              properties:
                evidenceId:
                  $ref: "#/components/schemas/Uuid"
                relation:
                  $ref: "#/components/schemas/EvidenceRelation"
                confidence:
                  $ref: "#/components/schemas/Confidence"
                scope:
                  type: string
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Problem"

  /claims/{id}/evidence/{evidenceId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: evidenceId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    delete:
      tags: [evidence]
      operationId: unlinkEvidenceFromClaim
      summary: Remove every link between the claim and the evidence
      responses:
        "200":
          description: Updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        default:
          $ref: "#/components/responses/Problem"

  /files/upload-sessions:
    post:
      tags: [evidence]
      operationId: createUploadSession
      summary: Create a pre-signed upload session for an evidence file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes]
              properties:
                fileName:
                  type: string
                mimeType:
                  type: string
                sizeBytes:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, objectKey, expiresAt]
                properties:
                  uploadUrl:
                    type: string
                    format: uri
                  objectKey:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        default:
          $ref: "#/components/responses/Problem"

  /job-postings:
    get:
      tags: [jobs]
      operationId: listJobPostings
      summary: List postings with their latest snapshot, newest capture first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          description: Full-text search over company, role title and the latest snapshot text
          schema:
            type: string
      responses:
        "200":
          description: Page of postings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobPosting"
                  nextCursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Problem"

  /job-postings/import:
    post:
      tags: [jobs]
      operationId: importJobPosting
      summary: Import a posting from pasted text, a URL, or a career-ops reference
      description: |
        Creates the posting (or reuses one with the same canonical url / external id in the
        workspace) and captures an immutable snapshot keyed by content hash. Re-importing
        unchanged text returns the existing snapshot; changed text adds a new one.
        URL_FETCH and CAREER_OPS answer 501 NOT_IMPLEMENTED until their integrations exist.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [source, text, company, roleTitle]
                  properties:
                    source:
                      const: MANUAL_TEXT
                    text:
                      type: string
                    company:
                      type: string
                      maxLength: 200
                    roleTitle:
                      type: string
                      maxLength: 200
                    sourceUrl:
                      type: [string, "null"]
                      format: uri
                    publishedAt:
                      type: [string, "null"]
                      format: date-time
                - type: object
                  required: [source, url]
                  properties:
                    source:
                      const: URL_FETCH
                    url:
                      type: string
                      format: uri
                - type: object
                  required: [source, externalPostingId]
                  properties:
                    source:
                      const: CAREER_OPS
                    externalPostingId:
                      type: string
      responses:
        "201":
          description: Posting and snapshot (snapshotCreated is false when the text was already captured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        default:
          $ref: "#/components/responses/Problem"

  /job-postings/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [jobs]
      operationId: getJobPosting
      summary: Get a posting with all of its snapshots (newest first)
      responses:
        "200":
          description: Posting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPostingDetail"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [jobs]
      operationId: deleteJobPosting
      summary: Soft-delete a posting; its snapshots stay immutable in the trash
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /job-posting-snapshots/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [jobs]
      operationId: getJobPostingSnapshot
      summary: Read one immutable snapshot including its full text
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPostingSnapshot"
        default:
          $ref: "#/components/responses/Problem"

  /job-posting-snapshots/{id}/analysis-jobs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [jobs, async]
      operationId: startPostingAnalysis
      summary: Extract requirements from a snapshot (asynchronous)
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        default:
          $ref: "#/components/responses/Problem"

  /job-posting-snapshots/{id}/requirements:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [jobs]
      operationId: listRequirements
      summary: Requirements of a snapshot in display order (drafts included)
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Requirement"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [jobs]
      operationId: createRequirement
      summary: Add a requirement by hand (approved as written)
      description: Optional sourceSpan must lie inside the snapshot text (422 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, text]
              properties:
                category:
                  $ref: "#/components/schemas/RequirementCategory"
                text:
                  type: string
                  maxLength: 1000
                sourceSpan:
                  oneOf:
                    - $ref: "#/components/schemas/SourceSpan"
                    - type: "null"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        default:
          $ref: "#/components/responses/Problem"

  /requirements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [jobs]
      operationId: getRequirement
      summary: Get a requirement
      responses:
        "200":
          description: Requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [jobs]
      operationId: reviewRequirement
      summary: Reword, re-categorise, approve or exclude a requirement
      description: |
        Only APPROVED requirements are used for matching and generation. Status may be set to
        APPROVED or REJECTED; DRAFT is reserved for AI extraction. Omitted fields keep their value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  format: int64
                category:
                  $ref: "#/components/schemas/RequirementCategory"
                text:
                  type: string
                  maxLength: 1000
                sourceSpan:
                  oneOf:
                    - $ref: "#/components/schemas/SourceSpan"
                    - type: "null"
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
      responses:
        "200":
          description: Requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [jobs]
      operationId: deleteRequirement
      summary: Soft-delete a requirement
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /applications:
    get:
      tags: [applications]
      operationId: listApplications
      summary: List applications for the board, newest status change first
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - name: includeTerminal
          in: query
          description: Include WITHDRAWN, REVIEWED and HANDED_OFF_TO_ITERVIEW (default true; the board shows them in 종료)
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Applications (at most 200)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [applications]
      operationId: createApplication
      summary: Create an application for a posting snapshot
      description: Company and role are copied from the posting; the application starts INTERESTED.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshotId]
              properties:
                snapshotId:
                  $ref: "#/components/schemas/Uuid"
                deadlineAt:
                  type: [string, "null"]
                  format: date-time
      responses:
        "201":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      operationId: getApplication
      summary: Get an application with its status history and posting summary
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [applications]
      operationId: updateApplication
      summary: Update the deadline (optimistic locking via version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                deadlineAt:
                  type: [string, "null"]
                  format: date-time
                version:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [applications]
      operationId: deleteApplication
      summary: Soft-delete an application; its status events and submissions stay
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/transitions:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [applications]
      operationId: transitionApplication
      summary: Move the application to another status
      description: |
        Only transitions allowed by the domain state machine succeed (409
        INVALID_STATUS_TRANSITION otherwise); the response lists what is allowed next.
        HANDED_OFF_TO_ITERVIEW cannot be set here — it is the result of an interview handoff.
        Moving to SUBMITTED through this endpoint records the result without a document;
        `/applications/{id}/submissions` is the path that also freezes a submission snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, version]
              properties:
                to:
                  $ref: "#/components/schemas/ApplicationStatus"
                note:
                  type: [string, "null"]
                  maxLength: 500
                version:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Application after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/match-jobs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [applications, async]
      operationId: startMatching
      summary: Match approved requirements against claims and evidence (asynchronous)
      description: |
        Scores every approved requirement of the application's snapshot against the workspace's
        claims with deterministic features, then asks the model to explain the top candidates.
        Confidential/restricted claims are skipped. Re-running keeps the user's accept/reject
        decisions. While a run is pending the same job is returned.
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/matches:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      operationId: getMatches
      summary: The latest match report for an application (J02)
      responses:
        "200":
          description: Match report grouped by requirement; empty when matching has not run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReport"
        default:
          $ref: "#/components/responses/Problem"

  /requirement-matches/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [applications]
      operationId: decideMatch
      summary: Accept or reject a recommendation, or clear the decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  oneOf:
                    - $ref: "#/components/schemas/MatchDecision"
                    - type: "null"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementMatch"
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/submissions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      operationId: listSubmissions
      summary: Submission snapshots of this application, newest first
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubmissionSnapshot"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [applications]
      operationId: createSubmission
      summary: Freeze an immutable submission snapshot and move the application to SUBMITTED
      description: |
        The version must belong to a document of this application and every INFERRED/UNSUPPORTED
        block must be approved (422 UNSUPPORTED_CLAIM_IN_EXPORT). From INTERESTED/PREPARING the
        application moves to SUBMITTED (INTERESTED passes through PREPARING so the history is
        honest); while already SUBMITTED a correction snapshot is added without a transition;
        later statuses refuse (422 DOMAIN_RULE_VIOLATION). Snapshots are never updated or deleted
        (ADR-0006).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentVersionId]
              properties:
                documentVersionId:
                  $ref: "#/components/schemas/Uuid"
                submittedAt:
                  description: Defaults to now; may not be in the future
                  type: string
                  format: date-time
                note:
                  description: Recorded on the status event
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Submission snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionSnapshot"
        default:
          $ref: "#/components/responses/Problem"

  /submission-snapshots/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      operationId: getSubmission
      summary: A submission snapshot with the frozen document version it points to
      responses:
        "200":
          description: Submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetail"
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      operationId: listReviews
      summary: Reviews written for this application, oldest first
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [applications]
      operationId: createReview
      summary: Record a post-result review (facts and hypotheses kept apart)
      description: |
        Allowed only in DOCUMENT_REJECTED, NO_RESPONSE, REVIEW_PENDING or REVIEWED (422 otherwise).
        The first review moves DOCUMENT_REJECTED/NO_RESPONSE through REVIEW_PENDING to REVIEWED.
        `warnings` lists definitive-cause phrases found in the hypothesis or rationale; the
        review is still saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/review-context:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      operationId: getReviewContext
      summary: Comparison material for a review (A02)
      description: |
        Observable facts only — the posting snapshot, the latest submission and what its
        document version contains, and the match verdicts per approved requirement. Nothing
        here states a cause; the user may quote lines into a review's rationale.
      responses:
        "200":
          description: Review context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewContext"
        default:
          $ref: "#/components/responses/Problem"

  /reviews/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [applications]
      operationId: getReview
      summary: Get a review
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [applications]
      operationId: updateReview
      summary: Update a review (optimistic locking via version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReviewInput"
                - type: object
                  required: [version]
                  properties:
                    version:
                      type: integer
                      format: int64
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [applications]
      operationId: deleteReview
      summary: Delete a review
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/interview-handoffs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [applications]
      operationId: requestInterviewHandoff
      summary: Hand a DOCUMENT_PASSED application off to iterview with explicit consent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                consent:
                  type: boolean
                  const: true
                note:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        default:
          $ref: "#/components/responses/Problem"

  /applications/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [documents]
      operationId: listApplicationDocuments
      summary: Documents of an application, newest first
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [documents]
      operationId: createDocument
      summary: Create an empty document for an application
      description: The document has no version until one is generated or saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              properties:
                type:
                  $ref: "#/components/schemas/DocumentType"
                title:
                  type: string
                  maxLength: 200
                language:
                  type: string
                  default: ko
      responses:
        "201":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [documents]
      operationId: getDocument
      summary: Document with its latest version and the template sections
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/generation-jobs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [documents, async]
      operationId: startDocumentGeneration
      summary: Generate a new AI-drafted version from selected sources (asynchronous)
      description: |
        Sources default to the application's approved requirements and the match candidates the
        user ACCEPTED (F05); `claimIds`/`requirementIds` narrow that set and never widen it.
        The model only phrases and arranges those facts. The server whitelists every reference,
        caps each block's certainty at the evidence level of the claims it cites, and stores the
        result as an unapproved AI version. Job type `document.generation`; the job result carries
        `versionId`. Rejected with 422 when nothing has been accepted for the application.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateVersion:
                  type: string
                  default: ko-v1
                parentVersionId:
                  $ref: "#/components/schemas/Uuid"
                claimIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/Uuid"
                requirementIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/Uuid"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [documents]
      operationId: listDocumentVersions
      summary: List versions of a document
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentVersion"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [documents]
      operationId: createDocumentVersion
      summary: Save a user-edited version
      description: |
        Users may edit text, drop or reorder blocks and approve INFERRED/UNSUPPORTED ones. A block
        may not cite a source its parent block did not, and its certainty can only go down; blocks
        typed by hand are UNSUPPORTED. Violations are 422 DOMAIN_RULE_VIOLATION. The parent must be
        the document's latest version (409 CONFLICT_STALE_VERSION otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                parentVersionId:
                  description: The document's latest version; omitted only while the document has none
                  $ref: "#/components/schemas/Uuid"
                label:
                  type: string
                blocks:
                  type: array
                  items:
                    $ref: "#/components/schemas/DocumentBlock"
      responses:
        "201":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersion"
        default:
          $ref: "#/components/responses/Problem"

  /document-versions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [documents]
      operationId: getDocumentVersion
      summary: Get a document version with its blocks and provenance
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersion"
        default:
          $ref: "#/components/responses/Problem"

  /document-versions/{id}/exports:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [documents, async]
      operationId: startExport
      summary: Render a version to DOCX, PDF, Markdown or JSON (asynchronous)
      description: Rejected with `UNSUPPORTED_CLAIM_IN_EXPORT` while any INFERRED or UNSUPPORTED block is unapproved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  $ref: "#/components/schemas/ExportFormat"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        default:
          $ref: "#/components/responses/Problem"

  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [async]
      operationId: getJob
      summary: Poll an asynchronous job
      responses:
        "200":
          description: Job status and, when finished, its result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC-issued session token. Provider is TBD (docs/project/open-decisions.md).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Repeating a request with the same key returns the original result.
      schema:
        type: string
        maxLength: 120

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Accepted:
      description: Work accepted; poll `GET /jobs/{jobId}`
      content:
        application/json:
          schema:
            type: object
            required: [jobId]
            properties:
              jobId:
                $ref: "#/components/schemas/Uuid"

  schemas:
    Uuid:
      type: string
      format: uuid

    DashboardSummary:
      type: object
      required: [kpis, timeline, recentEvidence, attention]
      properties:
        kpis:
          type: object
          required: [careerEntries, verifiedEvidence, activeApplications, evidenceCoverage]
          properties:
            careerEntries:
              type: object
              required: [total, addedLast30Days, projects, achievements]
              properties:
                total:
                  type: integer
                addedLast30Days:
                  type: integer
                projects:
                  type: integer
                achievements:
                  type: integer
            verifiedEvidence:
              type: object
              required: [verified, total, expired, addedLast30Days]
              properties:
                verified:
                  type: integer
                total:
                  type: integer
                expired:
                  type: integer
                addedLast30Days:
                  type: integer
            activeApplications:
              type: object
              required: [total, submitted, documentPassed]
              properties:
                total:
                  type: integer
                submitted:
                  type: integer
                documentPassed:
                  type: integer
            evidenceCoverage:
              type: object
              required: [claims, supported, ratio]
              properties:
                claims:
                  type: integer
                supported:
                  type: integer
                ratio:
                  type: integer
                  description: supported / claims × 100, 0 when there are no claims
        timeline:
          type: array
          description: Most recent career entries by start date
          items:
            type: object
            required: [id, type, title, startDate, projectCount, claimCount, evidenceCount]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              type:
                $ref: "#/components/schemas/CareerEntryType"
              title:
                type: string
              organization:
                type: [string, "null"]
              startDate:
                type: string
                format: date
              endDate:
                type: [string, "null"]
                format: date
              projectCount:
                type: integer
              claimCount:
                type: integer
              evidenceCount:
                type: integer
                description: Distinct evidence linked to claims about the entry, its projects or their achievements
        recentEvidence:
          type: array
          items:
            type: object
            required: [id, title, type, verification, capturedAt]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              title:
                type: string
              type:
                $ref: "#/components/schemas/EvidenceType"
              verification:
                $ref: "#/components/schemas/VerificationStatus"
              capturedAt:
                type: string
                format: date-time
        attention:
          type: array
          description: Up to three items that need the user's action, most impactful first
          items:
            type: object
            required: [code, count]
            properties:
              code:
                type: string
                enum:
                  [
                    UNSUPPORTED_CLAIMS,
                    UNVERIFIED_EVIDENCE,
                    ENTRIES_WITHOUT_PROJECTS,
                    NO_CAREER_ENTRIES,
                  ]
              count:
                type: integer
    Revision:
      type: integer
      format: int64
      minimum: 1
    Confidence:
      type: number
      minimum: 0
      maximum: 1

    ProblemDetail:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
              rejectedValue: {}

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - REAUTHENTICATION_REQUIRED
        - FORBIDDEN_WORKSPACE
        - NOT_FOUND
        - CONFLICT_STALE_VERSION
        - INVALID_STATUS_TRANSITION
        - SNAPSHOT_IMMUTABLE
        - DOMAIN_RULE_VIOLATION
        - UNSUPPORTED_CLAIM_IN_EXPORT
        - RATE_LIMITED
        - AI_PROVIDER_UNAVAILABLE
        - AI_REFUSED
        - AI_OUTPUT_INVALID
        - AI_BUDGET_EXCEEDED
        - NOT_IMPLEMENTED
        - INTERNAL_ERROR

    Visibility:
      type: string
      enum: [PRIVATE, SELECTIVE, PUBLIC]
    CareerEntryType:
      type: string
      enum: [EMPLOYMENT, EDUCATION, TRAINING, AWARD, CERTIFICATION, OTHER]
    CareerEntryStatus:
      type: string
      enum: [ACTIVE, ARCHIVED, DELETED]
    EvidenceRelation:
      type: string
      enum: [SUPPORTS, REFUTES, PARTIALLY_SUPPORTS]
    RequirementCategory:
      type: string
      enum: [REQUIRED, PREFERRED, RESPONSIBILITY, SKILL, BEHAVIORAL]
    RequirementStatus:
      type: string
      enum: [DRAFT, APPROVED, REJECTED]
    ApplicationStatus:
      type: string
      enum:
        - INTERESTED
        - PREPARING
        - SUBMITTED
        - DOCUMENT_PASSED
        - DOCUMENT_REJECTED
        - NO_RESPONSE
        - WITHDRAWN
        - HANDOFF_READY
        - HANDED_OFF_TO_ITERVIEW
        - REVIEW_PENDING
        - REVIEWED
    Certainty:
      type: string
      enum: [SUPPORTED, INFERRED, UNSUPPORTED]
    ExportFormat:
      type: string
      enum: [DOCX, PDF, MARKDOWN, JSON]
    JobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    ReviewConfidence:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    CareerEntryInput:
      type: object
      required: [type, title, startDate]
      properties:
        type:
          $ref: "#/components/schemas/CareerEntryType"
        title:
          type: string
          maxLength: 200
        organization:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    CareerEntry:
      allOf:
        - $ref: "#/components/schemas/CareerEntryInput"
        - type: object
          required: [id, visibility, status, revision, createdAt, updatedAt]
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            visibility:
              $ref: "#/components/schemas/Visibility"
            status:
              $ref: "#/components/schemas/CareerEntryStatus"
            revision:
              $ref: "#/components/schemas/Revision"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ProjectLink:
      type: object
      required: [label, url]
