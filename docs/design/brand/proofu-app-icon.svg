<!-- App store export: a full-bleed square. iOS and Android apply their own corner mask, so no
     corner radius is drawn here. The mark is white at 70% of the tile, on royal blue. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <rect width="120" height="120" fill="#3B5998"/>
  <g transform="translate(60 60) scale(0.7) translate(-61 -62)">
    <circle cx="45" cy="36" r="10" fill="#fff"/>
    <circle cx="77" cy="36" r="10" fill="#fff"/>
    <polyline points="28,66 52,90 94,50" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
