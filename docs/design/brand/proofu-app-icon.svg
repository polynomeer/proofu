<!-- App store export: a full-bleed square. iOS and Android apply their own corner mask, so no
     corner radius is drawn here. The mark is white at 72% of the tile, on royal blue. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <rect width="120" height="120" fill="#3B5998"/>
  <g transform="translate(60 60) scale(0.72) translate(-60 -60)">
    <g fill="none" stroke="#fff" stroke-width="11"><path d="M36 14H18V106H36"/><path d="M84 14H102V106H84"/></g>
    <circle cx="60" cy="38" r="9.5" fill="#fff"/>
    <polyline points="42,64 56,78 80,54" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
