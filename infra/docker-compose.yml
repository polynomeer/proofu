# Local development dependencies. Never used for production data.
name: proofu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proofu
      POSTGRES_USER: proofu
      POSTGRES_PASSWORD: proofu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofu -d proofu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
