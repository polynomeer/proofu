# Local development dependencies. Never used for production data.
name: proofu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proofu
      POSTGRES_USER: proofu
      POSTGRES_PASSWORD: proofu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofu -d proofu"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local OIDC issuer (ADR-0010). Realm "proofu", client "proofu-web", user dev@proofu.local / devpass.
  # Start with: docker compose -f infra/docker-compose.yml --profile auth up -d
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["auth"]
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
