name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck build
      - name: Enum values agree across domain, database and contract
        run: python3 scripts/check-enums.py

  jvm:
    name: Domain, API and worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check --no-daemon

  contract-compatibility:
    name: OpenAPI contract vs runtime spec
    runs-on: ubuntu-latest
    needs: [jvm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build API
        run: ./gradlew :api:bootJar --no-daemon
      - name: Start API and export runtime OpenAPI
        run: |
          docker run -d --name pg -e POSTGRES_DB=proofu -e POSTGRES_USER=proofu -e POSTGRES_PASSWORD=proofu -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U proofu && break; sleep 1; done
          java -jar apps/api/build/libs/api-*.jar &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/actuator/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/v1/openapi.json -o runtime-openapi.json
      - name: Compare with packages/contracts/openapi.yaml
        # The contract is the single source of truth: an operation the server does not serve, or
        # one it serves without declaring, fails the build. Paths that are agreed but not built
        # answer 501 (PendingIntegrationsController), which keeps both documents in step.
        run: bash scripts/contract-diff.sh packages/contracts/openapi.yaml runtime-openapi.json

  e2e:
    name: Browser journeys (Playwright, mock IdP, fake AI)
    runs-on: ubuntu-latest
    needs: [web, jvm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run the journeys against a real stack
        run: scripts/e2e.sh
        env:
          CI: "true"
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            ${{ runner.temp }}/e2e-logs
          retention-days: 14
